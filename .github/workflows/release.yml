name: MPCDev release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh tools/build.sh hello-001
      - run: sh tests/smoke.sh
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mpcdev-hello-001
          path: dist/
          if-no-files-found: error

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#101114" />
  <title>LinnStrument iPad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <header id="controls" class="controls">
      <div class="brand">LinnStrument iPad</div>

      <button id="enableMidiButton" class="primary">Enable MIDI</button>

      <label class="control-group">
        <span>MIDI out</span>
        <select id="midiOutputSelect" disabled>
          <option value="">No output</option>
        </select>
      </label>

      <div class="mode-switch" aria-label="Board display mode">
        <button id="trueScaleModeButton" class="mode-button selected">True Scale</button>
        <button id="fullBoardModeButton" class="mode-button">Full 200</button>
      </div>

      <label class="control-group base-group">
        <span>Bottom-left pitch</span>
        <select id="baseNoteSelect"></select>
      </label>
      <button id="octaveDownButton" class="secondary compact" aria-label="Shift board down one octave">−12</button>
      <button id="octaveUpButton" class="secondary compact" aria-label="Shift board up one octave">+12</button>

      <button id="labelsButton" class="secondary">Labels On</button>
      <button id="fullScreenButton" class="secondary">Full Screen</button>

      <div class="readouts">
        <span id="midiStatus">MIDI not enabled</span>
        <span id="scaleStatus">Measuring surface…</span>
        <span id="windowStatus">Columns 1–10 of 25</span>
      </div>
    </header>

    <section id="surfaceViewport" class="surface-viewport" aria-label="LinnStrument-style MIDI surface">
      <button id="previousColumnsButton" class="edge-button edge-left" aria-label="Previous columns">‹</button>

      <div id="surfaceStage" class="surface-stage">
        <div id="padGrid" class="pad-grid" role="application" aria-label="LinnStrument-style pad grid"></div>
      </div>

      <button id="nextColumnsButton" class="edge-button edge-right" aria-label="Next columns">›</button>

      <div id="surfaceBadge" class="surface-badge">1–10 / 25</div>
      <button id="showControlsButton" class="show-controls" aria-label="Show controls">•••</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

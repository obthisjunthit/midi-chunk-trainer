<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111111" />
  <title>LinnTrainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="brand">LinnTrainer</div>

      <button id="enableMidiButton" class="primary">Enable MIDI</button>

      <label>
        MIDI out
        <select id="midiOutputSelect" disabled>
          <option value="">No output</option>
        </select>
      </label>

      <label>
        Base
        <select id="baseNoteSelect"></select>
      </label>

      <label>
        Rows
        <input id="rowsInput" type="number" min="1" max="16" value="8" inputmode="numeric" />
      </label>

      <label>
        Columns
        <input id="columnsInput" type="number" min="1" max="32" value="13" inputmode="numeric" />
      </label>

      <label>
        Across
        <input id="horizontalIntervalInput" type="number" min="-24" max="24" value="1" inputmode="numeric" />
      </label>

      <label>
        Up
        <input id="verticalIntervalInput" type="number" min="-24" max="24" value="5" inputmode="numeric" />
      </label>

      <button id="panicButton" class="secondary">Panic</button>
    </header>

    <section class="teacher-panel">
      <label class="file-button">
        <span>Load MIDI</span>
        <input id="midiFileInput" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" />
      </label>
      <div id="fileName" class="file-name">No MIDI loaded</div>
      <button id="playButton" class="primary" disabled>Play Teacher</button>
      <button id="pauseButton" class="secondary" disabled>Pause</button>
      <button id="stopButton" class="secondary" disabled>Stop</button>
      <label>
        Speed
        <select id="speedSelect">
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
        </select>
      </label>
      <div id="transportStatus" class="transport-status">Teacher ready on channel 2</div>
    </section>

    <section class="chunk-panel">
      <div class="timeline-wrap">
        <input id="timelineSlider" class="timeline-slider" type="range" min="0" max="1" step="0.01" value="0" disabled />
        <div id="timelineReadout" class="timeline-readout">0:00 / 0:00</div>
      </div>

      <button id="markStartButton" class="secondary" disabled>Set Start</button>
      <span id="chunkStartReadout" class="mark-readout">Start 0:00</span>
      <button id="markEndButton" class="secondary" disabled>Set End</button>
      <span id="chunkEndReadout" class="mark-readout">End 0:00</span>

      <input id="chunkNameInput" class="chunk-name-input" type="text" placeholder="Chunk name" maxlength="40" disabled />
      <button id="saveChunkButton" class="primary" disabled>Save Chunk</button>

      <label class="loop-toggle">
        <input id="loopChunkCheckbox" type="checkbox" />
        Loop chunk
      </label>

      <button id="playWholeButton" class="secondary" disabled>Whole File</button>
      <div id="activeChunkReadout" class="active-chunk">Whole file</div>
      <div id="chunkList" class="chunk-list"></div>
    </section>

    <section class="fingering-panel">
      <button id="fingeringModeButton" class="primary" disabled>Assign Pads</button>
      <button id="previousStepButton" class="secondary" disabled>◀ Step</button>
      <div id="stepReadout" class="step-readout">Select a chunk</div>
      <button id="nextStepButton" class="secondary" disabled>Step ▶</button>
      <div id="fingeringNotes" class="fingering-notes"></div>
      <button id="clearStepButton" class="secondary" disabled>Clear Step</button>
      <div id="fingeringStatus" class="fingering-status">Choose a saved chunk to assign exact pad locations.</div>
    </section>

    <section class="status-row">
      <span id="midiStatus">MIDI not enabled</span>
      <span>Student → ch 1</span>
      <span>Teacher → ch 2</span>
    </section>

    <section id="gridViewport" class="grid-viewport" aria-label="Isomorphic MIDI grid">
      <div id="padGrid" class="pad-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="chunks.js"></script>
  <script src="fingerings.js"></script>
</body>
</html>
